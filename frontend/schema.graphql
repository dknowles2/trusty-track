  heatSession(trackId: Int!, heatId: Int = null): HeatSession!
  raceStateChanged(raceId: Int!): RaceStateChangedEvent!
  leaderboard(raceId: Int!): [LeaderboardEntry!]!
  displayAssignment(displayId: String!, raceId: Int!, name: String = null): Display!
  displays(raceId: Int!): [Display!]!
  onDeck(raceId: Int!): [Heat!]!
  currentlyRacing(raceId: Int!): Heat
  timingStats(raceId: Int!): TimingStats
  heats(raceId: Int!): [Round!]!
  freeRaceHeat(heatId: Int!): FreeRaceHeat
  activeFreeRaceHeat(raceId: Int!): FreeRaceHeat
}

