  deleteRacer(id: Int!): Boolean!
  checkInRacer(id: Int!, passedInspection: Boolean!, weight: Float, racerImageUrl: String = null, carImageUrl: String = null): Racer
  createRacingGroup(raceId: Int!, racingGroup: RacingGroupInput!): RacingGroup!
  updateRacingGroup(id: Int!, racingGroup: RacingGroupInput!): RacingGroup
  deleteRacingGroup(id: Int!): Boolean!
  setLaneOutages(trackId: Int!, lanes: [Int!]!): [Int!]!
  createTrackRecord(trackId: Int!, record: HistoricalTrackRecordInput!): HistoricalTrackRecord!
  updateTrackRecord(recordId: Int!, record: HistoricalTrackRecordInput!): HistoricalTrackRecord!
  deleteTrackRecord(recordId: Int!): Boolean!
  createAward(raceId: Int!, award: AwardInput!): Award!
  updateAward(id: Int!, award: AwardInput!): Award
  deleteAward(id: Int!): Boolean!
  reorderAwards(raceId: Int!, awardIds: [Int!]!): [Award!]!
  castVote(awardId: Int!, racerId: Int!, ballotKey: String!): String
  createTrack(track: TrackInput!): Track!
  updateTrack(id: Int!, track: TrackInput!): Track
  deleteTrack(id: Int!): Boolean!
  createRoundWizard(raceId: Int!, config: WizardConfigurationInput!): [Round!]!
  regenerateRound(roundId: Int!): [Heat!]!
  deleteRound(roundId: Int!): Boolean!
  deleteHeat(heatId: Int!): Boolean!
  deleteFreeRaceHeat(heatId: Int!): Boolean!
  advanceRound(raceId: Int!, roundId: Int!): Int!
  reconnectTimer(trackId: Int!): Boolean!
  abortHeat(trackId: Int!): Boolean!
  forceResults(trackId: Int!): Boolean!
  startTimerTest(trackId: Int!): Boolean!
  releaseStartGate(trackId: Int!): String
  fakeTimerStart(heatId: Int!, isFreeRace: Boolean! = false): Boolean!
  prepareHeat(heatId: Int!, isFreeRace: Boolean! = false): Boolean!
  fakeTimerFinish(heatId: Int!, isFreeRace: Boolean! = false): Boolean!
  updateHeatResult(heatId: Int!, lanes: [HeatLaneInput!]!): Heat
  bulkAutoNumber(racerIds: [Int!]!): Int!
  bulkClearNumbers(racerIds: [Int!]!): Boolean!
  bulkCheckIn(racerIds: [Int!]!, passedInspection: Boolean! = true): Boolean!
  bulkMoveToRacingGroup(racerIds: [Int!]!, racingGroupId: Int): Boolean!
  bulkDeleteRacers(racerIds: [Int!]!): Boolean!
  bulkAssignPhotos(assignments: [PhotoAssignmentInput!]!): Int!
  createInitialConfig(config: InitialConfigInput!): InitialConfigStatus!
  resetTimer(trackId: Int!): Boolean!
  updateInitialConfig(config: InitialConfigInput!): InitialConfigStatus!
  populateRace(raceId: Int!, config: PopulateTestDataInput!): String!
  createPracticeRace: Race!
  importRacers(raceId: Int!, csvData: String!): Int!
  createRound(raceId: Int!, roundData: RoundCreateInput!): [Round!]!
  reorderHeats(heatUpdates: [HeatReorderItemInput!]!): HeatReorderResponse!
  startFreeRaceHeat(raceId: Int!, laneAssignments: [FreeRaceLaneAssignmentInput!]!): FreeRaceHeat!
  recordFreeRaceResult(heatId: Int!, lanes: [HeatLaneInput!]!): FreeRaceHeat
  uploadImage(dataUrl: String!): String!
}

