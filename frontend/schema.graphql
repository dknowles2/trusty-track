}

input RaceUpdateInput {
  name: String = null
  dateTime: String = null
  location: String = null
  trackId: Int = null
  scoringStrategy: String = null
  carNumberingStrategy: String = null
  globalStartNumber: Int = null
  championshipTrophies: Int = null
  autoAdvanceHeat: Boolean = null
