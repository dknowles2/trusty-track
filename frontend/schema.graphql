type Mutation {
  createRace(race: RaceInput!): Race!
  updateRace(id: Int!, race: RaceUpdateInput!): Race
  deleteRace(id: Int!): Boolean!
  assignDisplay(view: DisplayView!, displayId: String!, cycleSeconds: Int = null): Display
  renameDisplay(displayId: String!, name: String!): Display
  forgetDisplay(displayId: String!): Boolean!
  createRacer(racer: RacerInput!): Racer!
  updateRacer(id: Int!, racer: RacerInput!): Racer
  deleteRacer(id: Int!): Boolean!
  checkInRacer(id: Int!, passedInspection: Boolean!, weight: Float, racerImageUrl: String = null, carImageUrl: String = null): Racer
  createDen(raceId: Int!, den: DenInput!): Den!
  updateDen(id: Int!, den: DenInput!): Den
  deleteDen(id: Int!): Boolean!
  setLaneOutages(trackId: Int!, lanes: [Int!]!): [Int!]!
  createAward(raceId: Int!, award: AwardInput!): Award!
  updateAward(id: Int!, award: AwardInput!): Award
  deleteAward(id: Int!): Boolean!
  reorderAwards(raceId: Int!, awardIds: [Int!]!): [Award!]!
  createTrack(track: TrackInput!): Track!
  updateTrack(id: Int!, track: TrackInput!): Track
  deleteTrack(id: Int!): Boolean!
  createRoundWizard(raceId: Int!, config: WizardConfigurationInput!): [Round!]!
  regenerateRound(roundId: Int!): [Heat!]!
  deleteRound(roundId: Int!): Boolean!
  deleteHeat(heatId: Int!): Boolean!
  deleteFreeRaceHeat(heatId: Int!): Boolean!
  advanceRound(raceId: Int!, roundId: Int!): Int!
  reconnectTimer(trackId: Int!): Boolean!
  abortHeat(trackId: Int!): Boolean!
  forceResults(trackId: Int!): Boolean!
  releaseStartGate(trackId: Int!): String
  fakeTimerStart(heatId: Int!, isFreeRace: Boolean! = false): Boolean!
  prepareHeat(heatId: Int!, isFreeRace: Boolean! = false): Boolean!
  fakeTimerFinish(heatId: Int!, isFreeRace: Boolean! = false): Boolean!
  updateHeatResult(heatId: Int!, lanes: [HeatLaneInput!]!): Heat
  bulkAutoNumber(racerIds: [Int!]!): Int!
  bulkClearNumbers(racerIds: [Int!]!): Boolean!
  bulkCheckIn(racerIds: [Int!]!, passedInspection: Boolean! = true): Boolean!
  bulkMoveToDen(racerIds: [Int!]!, denId: Int): Boolean!
  bulkDeleteRacers(racerIds: [Int!]!): Boolean!
  bulkAssignPhotos(assignments: [PhotoAssignmentInput!]!): Int!
  createInitialConfig(config: InitialConfigInput!): InitialConfigStatus!
  resetTimer(trackId: Int!): Boolean!
  updateInitialConfig(config: InitialConfigInput!): InitialConfigStatus!
  populateRace(raceId: Int!, config: PopulateTestDataInput!): String!
  createPracticeRace: Race!
  importRacers(raceId: Int!, csvData: String!): Int!
  createRound(raceId: Int!, roundData: RoundCreateInput!): [Round!]!
  reorderHeats(heatUpdates: [HeatReorderItemInput!]!): HeatReorderResponse!
  startFreeRaceHeat(raceId: Int!, laneAssignments: [FreeRaceLaneAssignmentInput!]!): FreeRaceHeat!
  recordFreeRaceResult(heatId: Int!, lanes: [HeatLaneInput!]!): FreeRaceHeat
  uploadImage(dataUrl: String!): String!
}

input PhotoAssignmentInput {
  racerId: Int!
  url: String!
  photoType: String!
}

input PopulateTestDataInput {
  count: Int! = 10
  addRacerPhotos: Boolean! = true
  addCarPhotos: Boolean! = true
  assignDens: Boolean! = true
  checkIn: Boolean! = false
}

type Query {
  displays(raceId: Int!): [Display!]!
  auditLog(raceId: Int = null, limit: Int! = 200, beforeId: Int = null): [AuditLogEntry!]!
  races(skip: Int! = 0, limit: Int! = 100): [Race!]!
  timerModels: [TimerModel!]!
  version: String!
  race(raceId: Int!): Race
  racers(raceId: Int = null, skip: Int! = 0, limit: Int! = 100): [Racer!]!
  racer(racerId: Int!): Racer
  tracks: [Track!]!
  groups: [Group!]!
  initialConfig: InitialConfigStatus!
  rounds(raceId: Int!): [Round!]!
  advancementStatus(raceId: Int!, roundId: Int!): AdvancementStatus!
  freeRaceHeats(raceId: Int!, limit: Int! = 10): [FreeRaceHeat!]!
  activeFreeRaceHeat(raceId: Int!): FreeRaceHeat
  randomFreeRaceLanes(raceId: Int!): [FreeRaceLaneAssignment!]!
  timerStatus(trackId: Int!): TimerStatus
  heatSession(trackId: Int!, heatId: Int = null): HeatSession!
  raceStats(raceId: Int!): RaceStats
}

type Race {
  id: Int!
  name: String!
  dateTime: String
  location: String
  groupId: Int!
  trackId: Int
  carNumberingStrategy: String!
  globalStartNumber: Int!
  championshipTrophies: Int!
  scoringStrategy: String!
  autoAdvanceHeat: Boolean!
  weightLimitOz: Float
  leaderboard(roundId: Int = null, includeAllRounds: Boolean! = false): [LeaderboardEntry!]!
  awards: [Award!]!
  registeredCount: Int!
  checkedInCount: Int!
  dens: [Den!]!
  racers: [Racer!]!
  scheduledRacerIds: [Int!]!
  group: Group!
  rounds: [Round!]!
  heats: [Heat!]!
  track: Track
}

enum RaceChangeKind {
  HEAT_RESULT
  RACER
  ROSTER
  SCHEDULE
  RACE_SETTINGS
  OTHER
}

input RaceInput {
  name: String!
  dateTime: String = null
  location: String = null
