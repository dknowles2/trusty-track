site_name: Trusty Track Help
site_description: User guide for Trusty Track Pinewood Derby race management
site_url: https://trusty-track.com/docs/
repo_url: https://github.com/dknowles2/trusty-track
repo_name: trusty-track
edit_uri: edit/main/docs/

theme:
  name: material
  # Three palettes rather than one, because the landing page at the root of
  # this domain follows `prefers-color-scheme` and the guides did not: a
  # visitor reading in the dark crossed from one to the other and the page went
  # white. `media: "(prefers-color-scheme)"` is Material's "follow the system"
  # entry, and it is first so that it is the default; the other two are the
  # explicit overrides the toggle cycles to.
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Match my system
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom        # --scouting-blue (#003F87)
      accent: custom         # see assets/extra.css
      toggle:
        icon: material/brightness-7
        name: Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.action.edit    # "edit this page" link
  logo: assets/logo.png
  # Without this Material serves its own generic icon, so the documentation had
  # a different tab icon from the landing page it is half of. One square crop of
  # the logo's car, shared by both: the full logo is a wide sticker, and a
  # browser letterboxes it into a sliver at 16px.
  favicon: assets/favicon.png

# Clicking the logo leaves the documentation for the landing page at
# trusty-track.com. The two are one deployment (see scripts/build_site.sh), so
# "home" from inside the guides means the front door, not docs/index.md — which
# is still reachable as the first entry in the nav.
extra:
  homepage: https://trusty-track.com/

extra_css:
  - assets/extra.css         # custom color overrides

# Every top-level entry is a tab across the top of the page, because of
# `navigation.tabs` above. There were fifteen, which no longer fitted: the row
# scrolled sideways, so several pages were only reachable by finding a
# scrollbar most readers would never look for. Twelve of the fifteen were
# single pages sitting at the same level as "Home", so nothing grouped and
# there was no hierarchy for a reader to hold.
#
# Grouping moves nothing on disk, so every link and anchor into these pages is
# unchanged. Keep it to about eight tabs: a new page belongs inside one of
# these, not beside them.
#
# The docs are two sets, deliberately. The practical guides (Running a Race,
# Timers, and so on) are the HOW, written for a volunteer with a queue behind
# them: short sentences, bullets, one job per section. The Reference tab is
# the lookup: every rule and table in full, one topic per page, slightly more
# technical, linked from the practical pages rather than restated in them. A
# rule lives in reference/ and is *linked* from the guide that needs it —
# stating it in both is how the two drift.
nav:
  # "Home" is a group rather than a single page so that the comparison can sit
  # beside the welcome without becoming an eighth tab. Both are for somebody who
  # has not installed anything yet.
  - Home:
    - Welcome: index.md
    - How Trusty Track compares: comparison.md
  - Install:
    - Which method?: user/install.md
    - macOS App: user/install-mac.md
    - Windows App: user/install-windows.md
    - Docker: user/install-docker.md
    - Raspberry Pi: user/install-raspberry-pi.md
    - From Source: user/install-from-source.md
  - Running a Race:
    - Getting Started: getting-started.md
    - Race Setup: race-setup.md
    - Race Day: race-day.md
    - Scoring & Championships: scoring-and-championships.md
    - Free Race: free-race.md
    - Awards: awards.md
    - Race Stats: race-stats.md
  - Timers:
    - Hardware Timer: hardware-timer.md
    - Fake Timer: fake-timer.md
  - Displays and Printouts:
    - Observation Displays: observation-displays.md
    - Printables: printables.md
    - Themes: reference/themes.md
  - Network and Backups:
    - Access and Your Network: access-and-network.md
    - Backup and Restore: backup-and-restore.md
  - Reference:
    - Look Something Up: reference/index.md
    - Scoring: reference/scoring.md
    - Round Styles: reference/round-styles.md
    - Championship Rounds: reference/championship-rounds.md
    - Mid-Race Changes: reference/mid-race-changes.md
    - Race and Track Settings: reference/race-settings.md
    - Timers: reference/timers.md
    - Display Views: reference/displays.md
    - Printed Documents: reference/printing.md
    - Stats and Exports: reference/stats-and-exports.md
    - Backups: reference/backups.md
    - Roles and Permissions: reference/roles-and-permissions.md
    - Glossary: reference/glossary.md
  - Developers:
    - Development Guide: development.md
    - The Public Demo: demo.md
    - Design: design.md
    - Specification: spec.md
    - Scheduling Algorithms: scheduling-algorithms.md
    - DerbyNet Timer Protocol: derbynet-timer-protocol.md

plugins:
  - callouts               # renders GitHub's > [!TIP] blocks as admonitions
  - search

markdown_extensions:
  - admonition              # tip/note/warning boxes
  - attr_list               # image sizing via { width=... }
  - md_in_html
  - pymdownx.details        # collapsible sections
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
