site_name: Trusty Track Help
site_description: User guide for Trusty Track Pinewood Derby race management
site_url: https://dknowles2.github.io/trusty-track/
repo_url: https://github.com/dknowles2/trusty-track
repo_name: trusty-track
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    primary: custom          # --scouting-blue (#003F87)
    accent: custom           # --gold (#FCD116)
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.action.edit    # "edit this page" link
  logo: assets/logo.png

extra_css:
  - assets/extra.css         # custom color overrides

nav:
  - Home: index.md
  - Installation:
    - Which method?: user/install.md
    - macOS App: user/install-mac.md
    - Windows App: user/install-windows.md
    - Docker: user/install-docker.md
    - Raspberry Pi: user/install-raspberry-pi.md
    - From Source: user/install-from-source.md
  - Getting Started: getting-started.md
  - Race Setup: race-setup.md
  - Race Day: race-day.md
  - Printables: printables.md
  - Free Race: free-race.md
  - Hardware Timer: hardware-timer.md
  - Fake Timer: fake-timer.md
  - Observation Displays: observation-displays.md
  - Race Stats: race-stats.md
  - Developers:
    - Development Guide: development.md
    - Design: design.md
    - Specification: spec.md
    - Scheduling Algorithms: scheduling-algorithms.md

plugins:
  - callouts               # renders GitHub's > [!TIP] blocks as admonitions
  - search

markdown_extensions:
  - admonition              # tip/note/warning boxes
  - attr_list               # image sizing via { width=... }
  - md_in_html
  - pymdownx.details        # collapsible sections
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
