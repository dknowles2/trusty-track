name: Main Demo

# Every push to `main` becomes the developers' demo.
#
# The stable demo follows releases, which is right for an evaluator and wrong
# for somebody who merged a change ten minutes ago and wants to see it on a
# real host — the next tag might be weeks away. This builds the image at the
# merged commit, publishes it as `:main`, and hands it to `deploy-demo.yml`
# for the `main` instance. Same image, same `deploy.sh`, same demo mode — a
# second Cloud Run service that scales to zero like the first.
#
# Three things about it:
#
#   * No smoke test here, on purpose. CI's `Docker Build` job already ran the
#     container and waited on /health for the pull request this commit came
#     from, and the deploy's own health poll is the second check. Repeating
#     it would be a minute per merge for a question already answered twice.
#
#   * `linux/amd64` only. Cloud Run is amd64 and the arm64 half of the release
#     build is minutes of QEMU, paid on every merge for an image nothing pulls
#     on a Pi. `:main` is therefore not an install image — the docs say so —
#     and the release workflow's multi-arch build is untouched.
#
#   * Deployed by digest, not by the tag. `:main` moves on every push; the
#     digest is the one thing that names *this* build, so a queued deploy
#     cannot be handed a later commit's image by a tag that moved under it.
#
# Docs and the website never reach the image (the Dockerfile copies
# `pyproject.toml`, `backend/` and `frontend/` and nothing else), so a
# docs-only merge skips this — no cold start of the demo for a page nobody
# will see there. Anything else, this workflow's own file included, deploys.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "www/**"
      - ".claude/**"
      - "**.md"

permissions:
  contents: read

jobs:
  image:
    name: Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # The stamp a local dev build carries — `0.0.0-dev-<short sha>` from
      # `backend/version.py`'s own fallback — so /health on the main demo reads
      # like the checkout it came from, and the deploy can assert it. The
      # image has no `.git` to ask, which is why it is written in here.
      - name: Version from the commit
        id: version
        run: echo "version=0.0.0-dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set version in version.py
        run: echo "__version__ = \"${{ steps.version.outputs.version }}\"" > backend/version.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/trusty-track:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-demo:
    name: Main Demo
    needs: image
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-demo.yml
    with:
      instance: main
      image: ghcr.io/${{ github.repository_owner }}/trusty-track@${{ needs.image.outputs.digest }}
      expected_version: ${{ needs.image.outputs.version }}
