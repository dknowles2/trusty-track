name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # `regenerate-doc-screenshots.yml` dispatches this onto the branch of the
  # pull request it opens: a PR opened with the default `GITHUB_TOKEN`
  # triggers no `pull_request` run, and `main`'s ruleset requires every
  # check below by name, so without a run that PR could never merge.
  # `workflow_dispatch` is the one event a `GITHUB_TOKEN` *can* raise. The
  # check runs land on the branch's head commit, which is what the ruleset
  # reads, whatever event created them.
  workflow_dispatch: {}

# Nothing here writes to the repository. The default token is broader than
# that. The one job that writes anything at all — `doc-screenshots`, a sticky
# pull-request comment — widens its own permissions and no other job's.
permissions:
  contents: read

# A second push to a branch makes the first run's answer irrelevant, so stop
# paying for it. `main` is excluded by including the ref in the group: a push
# there is its own group and finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# GitHub's own default is `bash -e {0}` — no `pipefail`. A pipeline's exit
# status is then its *last* command's, so `some-check | tee "$GITHUB_STEP_SUMMARY"`
# reports success whenever `tee` succeeds, whatever `some-check` decided
# (dknowles2/trusty-track#918). That silently disabled the screenshot drift
# gate (#840) from the day it was written: `node compare-screenshots.ts ... |
# tee -a "$GITHUB_STEP_SUMMARY"` could never fail the job, and 51 violations
# went out green in #914. Set at the workflow level, not on the one step that
# needed it, because a *second* step written the same way — piping into `tee`
# for a step summary, which is an ordinary pattern — would reintroduce exactly
# this bug with nothing here to catch it. There is currently exactly one `|`
# pipe anywhere in this file's `run:` steps (the drift-gate step below); this
# changes no other step's behaviour.
defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  lint:
    name: Lint & Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      # The whole repo, not a list of directories — a hand-maintained list is
      # how a gate quietly stops covering things. `docs` is excluded in
      # pyproject.toml; everything else Python, wherever it lands, is linted.
      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      # Whole tree, with the not-yet-clean modules named as exemptions in
      # pyproject.toml rather than the checked ones named here — so a new module
      # is covered from the day it is written, and that list can only shrink.
      # `backend/domain/` is held to the stricter settings.
      - name: Types
        run: uv run mypy backend

  backend-test:
    name: Backend Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling. 3.10 is what `requires-python` promises and
        # what `install-pi.sh` runs on — Debian's system interpreter, not a uv
        # download — so it has to be tested rather than merely declared. 3.12 is
        # what `install.sh`, the Dockerfile and the release builds pin.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      # `-n auto` comes from `pyproject.toml`, so a run here matches a run by
      # hand. Not `-v`: 5,900 lines of PASSED is not a log anybody reads, and
      # under xdist they do not even arrive in order.
      - name: Run tests
        run: uv run pytest backend/tests/

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      # Both trees: `tsconfig.json` covers `src` only, so the end-to-end
      # specs were never type-checked. That is how a `BACKEND_URL` that no
      # longer existed reached a run — eslint does not resolve names, and the
      # only thing that noticed was fifty-six failing browser tests.
      - name: Typecheck
        run: npm run typecheck
        working-directory: frontend

      - name: Run tests
        run: npm test -- --run
        working-directory: frontend

  codegen-check:
    name: GraphQL Codegen Up To Date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: uv sync

      - name: Install Node dependencies
        run: npm ci
        working-directory: frontend

      # Regenerates schema.graphql and src/gql from the live Strawberry schema.
      # Fails if the committed output is stale, so backend schema changes cannot
      # silently drift from the frontend's types.
      - name: Check generated types are current
        run: npm run codegen:check
        working-directory: frontend

  docs-build:
    name: Docs Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --only-group docs

      # The whole of trusty-track.com, not just the guides: the landing page
      # and the documentation are one deployment, and Cloudflare Pages builds
      # it with this same script. Running it here rather than a bare `mkdocs
      # build` means a build that only fails once the two are assembled
      # together fails on the pull request instead of on the site.
      - name: Build the site
        run: ./scripts/build_site.sh

  e2e:
    name: End-to-End Run (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Sharded *and* parallel within each shard. The two compose: a shard is
        # a separate runner with its own backend and its own data directory, so
        # the setup project running once per shard is not duplicated work, it is
        # the work that shard needs. It costs about two seconds.
        #
        # Both halves are needed because the job is not all test time. Setup —
        # checkout, `npm ci`, the Playwright browser and its system libraries —
        # is around fifty seconds whatever else happens, and parallelism alone
        # cannot touch it.
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: uv sync

      - name: Install Node dependencies
        run: npm ci
        working-directory: frontend

      # The browser is 150 MB and does not change between runs; downloading it
      # was a third of this job.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: frontend

      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      # No system-library step on the cache-hit path, which is measured rather
      # than assumed. `npx playwright install-deps chromium` on `ubuntu-latest`
      # reports every library Chromium links against as "already the newest
      # version" — the runner image carries them. What it does install is nine
      # font packages, 21 MB of them:
      #
      #   fonts-freefont-ttf fonts-ipafont-gothic fonts-tlwg-loma-otf
      #   fonts-unifont fonts-wqy-zenhei xfonts-cyrillic xfonts-encodings
      #   xfonts-scalable xfonts-utils
      #
      # Japanese, Chinese, Thai and Cyrillic glyphs, for a Cub Scout pack's race
      # results. Nothing here renders a character outside Latin-1, and nothing
      # in CI compares pixels — the checked-in screenshots are generated on a
      # developer's machine, so what fonts a runner has never reaches them.
      #
      # Caching those packages was the other option and is worth less than it
      # sounds: the download is 2 seconds of the step and `apt-get update`
      # refreshing four mirrors is most of the rest. It was 30-41 seconds on
      # every Playwright job, and there are four of them.
      #
      # `--with-deps` stays on the cache-miss path, so a runner image that ever
      # does drop a library is covered the next time the Playwright version
      # changes. If one goes missing in between, Chromium fails to launch and
      # Playwright's error names the package and the command that installs it.
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      # The only test that exercises the served page, the GraphQL round trip and
      # the normalized cache together. The unit suites all stub one of the three.
      - name: Run functional end-to-end tests
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/2
        working-directory: frontend

      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: frontend/test-results/
          retention-days: 7

  doc-screenshots:
    name: Doc Screenshots Run (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    # For the drift comment below, and nothing else; `contents` stays read.
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        # Sharded as well as parallel, for the reason set out on the e2e job
        # above: a shard is a separate machine with its own backend, so the
        # setup project it runs is its own, and the fixed cost of preparing a
        # runner is what parallelism inside the job cannot reach.
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7

      # A UI change silently invalidated the published docs four times in one
      # afternoon (dknowles2/trusty-track#838) before anything here compared a
      # single pixel — this job proved only that the specs still ran. The
      # snapshot has to be taken *before* the specs run: they write their
      # output straight into `docs/assets/screenshots/`, overwriting the
      # committed images in place, so this is the only point at which "what is
      # committed" and "what the working tree holds" are still the same thing.
      - name: Snapshot the committed screenshots for drift comparison
        run: cp -r docs/assets/screenshots /tmp/screenshot-baseline

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: uv sync

      - name: Install Node dependencies
        run: npm ci
        working-directory: frontend

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: frontend

      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      # `--with-deps` only on a cache miss, and no system-library step on a
      # hit — see the note on the End-to-End job above for the evidence.
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      # The docs' screenshots are generated by these specs, by hand, when a
      # screen changes — which is exactly the moment nobody wants to discover
      # the harness is broken. It was: the run died a third of the way through
      # for months, so most of the images had not been regenerated by anyone
      # (#114). This step alone still just proves the specs drive the app —
      # the images it writes are compared against what is committed by the
      # step below, which is what makes drift in the *result* visible too.
      #
      # `id` is read below so a spec failure and a drift failure report
      # differently. This step is deliberately left with no `continue-on-error`
      # and no `if:` of its own: a spec failure must still skip the comparison
      # step outright rather than run it against an incomplete candidate set.
      # A test file that fails partway through leaves *some* of its images
      # freshly regenerated and the rest as whatever `actions/checkout` put
      # there — copies of the committed baseline, byte-identical to it because
      # the spec that would have overwritten them never got that far. Comparing
      # that mix against the baseline reports "no drift" for every image the
      # run never touched, which is a confident false all-clear, not a
      # narrower true one — worse than the silence this step gets today by
      # being skipped (#918).
      - name: Run the documentation screenshot specs
        id: run_specs
        run: npx playwright test --config=playwright.screenshots.config.ts --shard=${{ matrix.shard }}/2
        working-directory: frontend

      # Hands the regenerated images back, so a red run here is something to
      # act on rather than something to reproduce (#931). A committed baseline
      # can only ever have been generated on *some* machine, and #931 found
      # that machine and this runner rasterise the identical layout
      # differently — every glyph, none of the geometry — so a baseline
      # regenerated on a developer's own laptop can never make this gate agree
      # with itself; only an image this runner produced can. `git status
      # --porcelain` against the working tree, taken straight after the specs
      # write into it, names exactly the files *this shard's own run* changed
      # — which is never ambiguous about which shard owns which image, since
      # each shard regenerates only its own slice of the suite (see the
      # sharding note above), and it is never the whole directory: a file this
      # run did not touch is still the byte-identical copy `actions/checkout`
      # put there, and handing it back anyway would let a stale shard silently
      # reinstate an old baseline over a newer one another shard already
      # produced. `always()`, and no dependency on the drift step below having
      # run at all — the whole point is to recover images from a run that
      # *failed* the drift check, which is the only way anyone escapes
      # regenerating locally and hoping it matches.
      - name: List images this shard regenerated
        id: regenerated
        if: always()
        run: |
          {
            echo 'files<<SCREENSHOT_EOF'
            git status --porcelain -- docs/assets/screenshots | cut -c4-
            echo 'SCREENSHOT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload the images this shard regenerated
        if: always() && steps.regenerated.outputs.files != ''
        uses: actions/upload-artifact@v7
        with:
          name: regenerated-screenshots-${{ matrix.shard }}
          path: ${{ steps.regenerated.outputs.files }}
          if-no-files-found: ignore
          retention-days: 14

      # Runs only when the specs step above failed, so a reviewer opening this
      # job for a red "Doc Screenshots" does not have to infer from a skipped
      # step that the candidate screenshots were never compared — the summary says
      # so directly, and distinctly from what the drift step's own summary
      # output below looks like. `always()` is required: without it GitHub
      # prepends an implicit `success()` to this condition and it would never
      # run.
      - name: Note that the spec failure above left the comparison skipped
        if: always() && steps.run_specs.outcome == 'failure'
        run: |
          {
            echo "### Doc Screenshots (shard ${{ matrix.shard }}/2): specs failed, drift not checked"
            echo
            echo "The screenshot comparison step did not run. A failed spec leaves this shard's candidate images incomplete — some regenerated by tests that got that far, some untouched leftovers from the checkout — and comparing that against the baseline would report false negatives for every image the run never reached. See the *Run the documentation screenshot specs* step's log for what broke."
          } >> "$GITHUB_STEP_SUMMARY"

      # The drift check (#838) — advisory, no longer a gate. It ran as a hard
      # failure for three days, and in that time the emails it sent were
      # almost entirely the mechanism working as designed: a baseline may only
      # come from this runner (#931), so every PR with a visible change *had*
      # to fail once, be handed its own artifact, and be pushed again. The few
      # remaining failures were the harness racing its own pictures (#970,
      # #977, #978, #986), several of them on `main` itself. What it never
      # once caught was an unintended visual regression. So: the specs still
      # fail the job when they break (that is a real test), but a pixel
      # difference is *reported* — the step summary, the artifacts, and a
      # sticky PR comment below — and never fails the job. Keeping the
      # committed baselines fresh is `regenerate-doc-screenshots.yml`'s job
      # now: it runs on every push to `main` and merges its own PR.
      #
      # `compare-screenshots.ts` uses pixelmatch with antialiasing detection on
      # (`includeAA: false`, its default), which is what makes a tight
      # threshold survivable: it does not count an
      # antialiased edge pixel as a mismatch on its own, so the residual left
      # once a font renders identically on every host (#821/#825) measures at
      # exactly zero across repeated clean runs for every image below — see
      # the measurement recorded in `.claude/rules/documentation.md`'s
      # screenshot section. 50 px / 0.05% sits far below the smallest genuine
      # UI change measured while building this gate (a focus ring, ~1,700 px /
      # 0.17%) and far above that zero residual.
      #
      # The excluded paths are every image measured, while building this gate,
      # to differ between two runs on a genuinely unchanged tree for a reason
      # that has nothing to do with rendering: `settings/04-activity-log.png`
      # (real clock times) and `printables/check-in-scanner.png` (camera
      # viewfinder placement) were already documented; the other two are
      # per-browser-context state nothing here seeds — see the rule file for
      # what causes each, since a tolerance loose enough to swallow them
      # would also swallow a real change of the same size. The four
      # `settings/*` images once listed here too traced to another spec's
      # temporary track still existing on the page when these were captured
      # (#841) — fixed by hiding every track card but the one being
      # photographed before either `screenshot-settings.spec.ts` or
      # `screenshot-timers.spec.ts` screenshots its own, so removed rather
      # than carried forward.
      #
      # `printables/car-sticker-{card,sheet}.png` and
      # `printables/check-in-code-{card,sheet}.png` joined this list turning
      # this gate on for the first time (#918): both cards render a QR code
      # through `barcodeSrc(racer.id)`, and `domain/printables.encode` puts the
      # *raw* database id in the payload it draws (`TT1:<race_id>:<racer_id>`,
      # by design — see that module's docstring). The docs specs run as
      # several files in parallel against one shared, freshly-created backend,
      # so which spec's `createRace`/`createRacer` calls land first — and so
      # which autoincrement ids this spec's race and racers get — depends on
      # scheduling, not on anything committed. Two runs of the identical
      # unchanged tree were measured reproducing four-image, sub-4%-of-pixels
      # diffs from this alone (see PR discussion). Unlike the other four, a
      # regeneration cannot make these two cards stable — the next run
      # reshuffles the ids again — so exclusion is the fix, not a stopgap
      # pending one.
      #
      # `set +e` around the comparison, deliberately: its exit status (which
      # `pipefail` above still carries through the `tee`) is *recorded* as
      # `drifted`, not obeyed. The `FAIL` lines it prints are the list the
      # comment below shows — the same lines a person reads in the summary.
      - name: Check for screenshot drift against the committed baseline
        id: drift
        run: |
          set +e
          node e2e/docs/compare-screenshots.ts \
            /tmp/screenshot-baseline \
            "$GITHUB_WORKSPACE/docs/assets/screenshots" \
            --max-diff-pixels 50 \
            --max-diff-ratio 0.0005 \
            --exclude "settings/04-activity-log.png,printables/check-in-scanner.png,observation/08-displays-panel.png,observation/13-qrcode.png,printables/car-sticker-card.png,printables/car-sticker-sheet.png,printables/check-in-code-card.png,printables/check-in-code-sheet.png" \
            --diff-dir /tmp/screenshot-diffs \
            --json /tmp/screenshot-drift.json | tee /tmp/screenshot-drift.txt
          status=$?
          set -e
          {
            echo "### Doc Screenshots (shard ${{ matrix.shard }}/2): drift check"
            echo
            if [ "$status" -eq 0 ]; then
              echo "No image this shard regenerated differs from the committed baseline beyond the threshold."
            else
              echo "Some images differ from the committed baseline. This is informational and does not fail the job. If the change is intended, nothing needs doing — \`regenerate-doc-screenshots.yml\` refreshes the baselines after the merge. If it is not, this shard's \`regenerated-screenshots-${{ matrix.shard }}\` and \`screenshot-drift-${{ matrix.shard }}\` artifacts hold the images and the pixel diffs."
            fi
            echo
            echo '```'
            cat /tmp/screenshot-drift.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -eq 0 ]; then
            echo "drifted=false" >> "$GITHUB_OUTPUT"
          else
            echo "drifted=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: frontend

      # One comment per shard, found again by its marker and edited in place
      # on every later run — so a PR whose drift was fixed reads "resolved"
      # rather than keeping a stale list, and a PR pushed ten times has one
      # comment, not ten. Nothing is posted at all until a shard has drifted
      # at least once: most PRs change no picture, and a comment saying so on
      # every one of them is noise. Only on `pull_request` — a `push` to
      # `main` or a dispatched run has no PR to write to.
      - name: Comment the drift on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHARD: ${{ matrix.shard }}
          DRIFTED: ${{ steps.drift.outputs.drifted }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker="<!-- doc-screenshots-drift-shard-${SHARD} -->"
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | head -1)
          if [ "$DRIFTED" != "true" ] && [ -z "$existing" ]; then
            exit 0
          fi
          {
            echo "$marker"
            if [ "$DRIFTED" = "true" ]; then
              count=$(grep -c '^FAIL' /tmp/screenshot-drift.txt || true)
              echo "### Doc screenshots: ${count} image(s) changed (shard ${SHARD}/2)"
              echo
              echo "Informational — this does not block the merge. If these are the pictures this change was meant to move, nothing needs doing: the baselines are regenerated automatically after the merge. If not, [the run](${RUN_URL}) has the regenerated images and pixel diffs as artifacts."
              echo
              echo '```'
              grep '^FAIL' /tmp/screenshot-drift.txt || true
              echo '```'
            else
              echo "### Doc screenshots: no drift (shard ${SHARD}/2)"
              echo
              echo "An earlier run of this pull request reported changed images; [the latest run](${RUN_URL}) reports none beyond the threshold."
            fi
          } > /tmp/drift-comment.md
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -F body=@/tmp/drift-comment.md > /dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -F body=@/tmp/drift-comment.md > /dev/null
          fi

      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-report-${{ matrix.shard }}
          path: frontend/test-results/
          retention-days: 7

      # Only meaningful once the drift step above has actually found something
      # — the diff images pixelmatch draws (original at low opacity, the
      # mismatched pixels highlighted) are what tells a reviewer "a focus ring
      # appeared here" apart from "the whole page is different" without
      # downloading and eyeballing two 100 KB PNGs by hand. Keyed on the step's
      # own `drifted` output, since the job no longer fails on drift.
      - name: Upload screenshot drift when there is any
        if: always() && steps.drift.outputs.drifted == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-drift-${{ matrix.shard }}
          path: |
            /tmp/screenshot-diffs/
            /tmp/screenshot-drift.json
          retention-days: 7

  # Two jobs that do nothing but carry a name.
  #
  # The repository's ruleset requires status checks by exact name, and it names
  # "End-to-End" and "Doc Screenshots" — so sharding those jobs renamed them to
  # "End-to-End (1/2)" and so on, the required contexts never reported again,
  # and every pull request was blocked from merging with nothing failing and
  # nothing pending. It cost one merge to find out.
  #
  # A gate job keeps the required name reporting whatever the shards are
  # called, so the number of shards can change without anybody editing
  # repository settings — and the ruleset goes on gating what it meant to. It
  # must be `if: always()`, or a failed shard skips the gate rather than
  # failing it, and a skipped required check is not a failure.
  e2e-gate:
    name: End-to-End
    runs-on: ubuntu-latest
    needs: e2e
    if: always()
    steps:
      - name: Every shard passed
        run: '[ "${{ needs.e2e.result }}" = "success" ]'

  doc-screenshots-gate:
    name: Doc Screenshots
    runs-on: ubuntu-latest
    needs: doc-screenshots
    if: always()
    steps:
      - name: Every shard passed
        run: '[ "${{ needs.doc-screenshots.result }}" = "success" ]'

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: trustytrack:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building proves it compiles; it does not prove it starts. A broken
      # entrypoint, a missing frontend build inside the image or a migration
      # that fails on an empty database all pass a build and fail at a venue.
      - name: Smoke test the image
        run: |
          docker run -d --name tt-smoke -p 8000:8000 \
            -e TRUSTYTRACK_DATA_DIR=/data trustytrack:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo "healthy"
              docker rm -f tt-smoke
              exit 0
            fi
            sleep 2
          done
          echo "container never became healthy"
          docker logs tt-smoke
          docker rm -f tt-smoke
          exit 1
