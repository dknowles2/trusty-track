name: Regenerate Doc Screenshots

# On-demand regeneration of docs/assets/screenshots (dknowles2/trusty-track#735).
#
# Originally written because the development sandbox did not render text the
# way whatever produced the checked-in baselines did, so running the doc
# screenshot specs there rewrote nearly every image with font-rasterisation
# noise rather than content — confirmed independently four times (see
# dknowles2/trusty-track#821). That was a font-*selection* bug, not a property
# of sandboxes: `index.css` declared its two bundled faces `font-display:
# swap` with nothing waiting on `document.fonts.ready`, so a screenshot taken
# inside the swap window captured whatever fallback font the *host* supplied
# instead of the bundled one — and several CSS rules named a bare `monospace`/
# `sans-serif`/`Arial` generic outright, which resolves however the host's own
# fontconfig (or platform equivalent) happens to be set up. #821 closed both:
# the screenshot fixture now waits on `document.fonts.ready` alongside its
# image wait, and every font-family reference in the frontend resolves to a
# bundled face. A local run and this job's `ubuntu-latest` agree on which
# *font* renders every glyph, because neither can reach past the bundled
# families to ask the host — but which font is not the whole question.
#
# dknowles2/trusty-track#931 found the half #821 could not reach: agreeing on
# *selection* does not mean agreeing on *rasterisation* — how FreeType turns a
# chosen glyph into pixels, which depends on the library version and its
# hinting/subpixel configuration, not on which font file was picked. Turning
# the drift gate on for the first time (dknowles2/trusty-track#918) found two
# CI shards' failing sets nearly disjoint (47 of 104 and 41 of 104, union 84 —
# essentially every image a shard regenerates), every glyph of every line
# differing at pixel-identical layout, and the identical commit regenerated in
# a development sandbox comparing clean at only 95 of 104 against the same
# committed baseline. A baseline generated outside CI can therefore never
# reliably pass a gate enforced inside it, however carefully or how many times
# it is regenerated — so baselines are generated where they are checked, this
# job's own `ubuntu-latest` run, never a local or sandboxed one. This job's
# Chromium launch now carries the three flags CI's does
# (`--font-render-hinting=none`, `--disable-font-subpixel-positioning`,
# `--disable-lcd-text`, in `playwright.screenshots.config.ts`), which narrow
# the class of host-dependent rasteriser input the two disagree on; they are a
# reduction, not a guarantee that any two FreeType versions agree on an
# unhinted glyph.
#
# None of that means every local diff is rasterisation, either. The images
# still accumulate ordinary, unrelated staleness between runs of this
# workflow — a redesigned printable, a new settings control — the same as any
# screenshot suite nobody runs on every merge, and that backlog shows up in
# the same diff a rasterisation difference would. This job's own two-run
# comparison below still catches a rerun that cannot reproduce itself; it says
# nothing about whether the diff against `main` is all one cause, and reading
# every stale image here as "just" a content backlog is the mistake that cost
# dknowles2/trusty-track#925 several cycles chasing a residual that was real
# drift, not staleness. CI's own "Doc Screenshots" job already runs these
# specs on ubuntu-latest with a pinned Playwright version — a reproducible,
# shared environment — but it only proves the specs still drive the app; it
# discards every image it produces.
#
# This is that same environment, run on demand, kept to actually produce the
# images — now genuinely reachable from a developer's own machine too, but
# still the easiest way to get a full, coherent, reviewable set without local
# setup:
#
#   - Unsharded. The CI job shards two ways so two machines can each prove a
#     subset of the specs still work; that is fine for a pass/fail check and
#     wrong here, since each shard would hold only *some* of the regenerated
#     images and neither machine would have the full, coherent set. This job
#     is not on anyone's critical path, so the extra wall-clock is free.
#   - Run twice, and the two runs are compared. This is #692's own standard
#     for trusting output like this: if a rerun cannot reproduce itself, its
#     output cannot be trusted either. Real non-determinism (a small number of
#     images are known to differ run to run — see
#     .claude/rules/documentation.md's screenshot section) is reported in the
#     PR body and the job summary rather than hidden or treated as a failure.
#   - Self-validated before anything is proposed. A pull request opened with
#     the default GITHUB_TOKEN does not trigger further workflow runs, so
#     "Docs Build" and test_docs_stay_current.py would never run on the very
#     PR that changes dozens of images unless this job runs them itself first.
#   - Opens a pull request rather than only uploading an artifact, because
#     GitHub renders an image diff in the PR view — which is the only way a
#     maintainer can tell a genuine content change from rasterisation noise
#     without downloading anything. The artifact upload is kept too, as a
#     cheap way to look at the images before the PR merges.
#   - Says nothing when nothing changed. An empty "regenerated" PR every time
#     this runs is how a tool like this stops getting used.
#
# One thing it deliberately does NOT establish: running this workflow proves
# the checked-out ref's specs produce a given set of images in this
# environment. It says nothing about whether a given diff is the *right*
# change — that reading is still a maintainer's job, which is exactly why the
# output is a PR and not a direct push to main.
#
# It now also runs on every push to `main`, and merges its own PR. CI's drift
# check on a pull request is advisory (see `ci.yml`'s `doc-screenshots` job
# for why it stopped being a gate): what keeps the committed baselines
# matching what the app renders is *this* job, run after every merge, from
# the one environment a baseline is allowed to come from. Three things about
# that, each a way of getting it wrong:
#
#   - `paths-ignore: docs/assets/screenshots/**` is what stops the loop. The
#     PR this job opens touches only those files, so its own merge to `main`
#     does not run this again; a merge that touches a screenshot *and*
#     anything else still does, since `paths-ignore` skips a push only when
#     every changed file matches.
#   - `concurrency` with `cancel-in-progress` collapses a burst of merges into
#     one run against the newest `main`. A cancelled run has opened nothing
#     yet, or has opened a PR the next run supersedes (it closes any open
#     `docs-screenshots/regen-*` PR before opening its own).
#   - The PR is opened with `GITHUB_TOKEN`. Since June 2026 that does raise a
#     `pull_request` event — but a bot-opened PR's CI run is created *awaiting
#     approval* rather than started, and `main`'s ruleset (nine required
#     checks by name) counts that pending run's checks as still owed: the
#     first attempt at this dispatched a second, separate CI run onto the
#     branch, saw every required context green from it, and watched the PR
#     (#1039) sit at BLOCKED until a person approved the waiting run by hand
#     — whereupon it merged the moment that run went green. So this job
#     approves its own PR's run (`actions: write`) and enables auto-merge,
#     and the PR lands when the checks pass. CI's own drift check cannot fail
#     that run (it is advisory, and the branch *is* the baseline); only a
#     genuine spec or build break can, which is what should hold a
#     regeneration back. Two repository settings have to be on for any of
#     this to work, and the two earlier by-hand runs of this workflow failed
#     on the first: Actions → General → "Allow GitHub Actions to create and
#     approve pull requests", and `main`'s ruleset must *not* require an
#     extra approval for unattributed changes (a bot PR is one).

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - "docs/assets/screenshots/**"

concurrency:
  group: regenerate-doc-screenshots
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regenerate:
    name: Regenerate and open a PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      # Approving the CI run GitHub holds back on the PR this job opens.
      actions: write
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The full dev group, not --only-group docs: this job also boots the
      # backend the screenshot specs drive, and runs the backend test suite's
      # test_docs_stay_current.py as its own validation step below.
      - name: Install Python dependencies
        run: uv sync

      - name: Install Node dependencies
        run: npm ci
        working-directory: frontend

      # Same cache key and reasoning as the ordinary CI jobs: the browser is
      # 150 MB and does not change between runs.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: frontend

      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      # What is committed, kept aside before the specs overwrite it in place —
      # the same snapshot CI's own job takes, and for the same reason: once
      # the first run has written into the directory there is no other copy
      # of the baseline to compare the result against.
      - name: Snapshot the committed screenshots
        run: |
          rm -rf /tmp/screenshots-baseline
          cp -r docs/assets/screenshots /tmp/screenshots-baseline

      # First run. Unsharded: every spec runs on this one machine, against
      # this one backend, so the resulting docs/assets/screenshots is a
      # complete, coherent set rather than a shard's slice of one.
      - name: Run the documentation screenshot specs (first run)
        run: npx playwright test --config=playwright.screenshots.config.ts
        working-directory: frontend

      - name: Set aside the first run's output
        run: |
          rm -rf /tmp/screenshots-run1
          cp -r docs/assets/screenshots /tmp/screenshots-run1

      # Second run, from a clean slate exactly like the first (the webServer
      # config wipes and recreates TRUSTYTRACK_DATA_DIR on every start). If
      # the specs and the app are genuinely deterministic under the seed
      # described in .claude/rules/documentation.md, this overwrites every
      # image with byte-identical bytes.
      - name: Run the documentation screenshot specs (second run)
        run: npx playwright test --config=playwright.screenshots.config.ts
        working-directory: frontend

      # Not a pass/fail gate. A handful of images are already known to differ
      # run to run for reasons that have nothing to do with the app (real
      # clock times, camera viewfinder placement) — see
      # .claude/rules/documentation.md. This step records what actually
      # differed so the PR body and job summary can say so, rather than
      # silently trusting whichever run happened to run second.
      - name: Compare the two runs
        id: determinism
        run: |
          set +e
          diff -rq /tmp/screenshots-run1 docs/assets/screenshots > /tmp/determinism-diff.txt
          if [ -s /tmp/determinism-diff.txt ]; then
            echo "identical=false" >> "$GITHUB_OUTPUT"
            echo "The two runs did not agree on every image:"
            cat /tmp/determinism-diff.txt
          else
            echo "identical=true" >> "$GITHUB_OUTPUT"
            echo "The two runs produced byte-identical output."
          fi

      # `diff -rq` above only says *which* images changed, not how much --
      # not enough to tell a genuine content race (#918) from a one-glyph
      # rasterisation residual, or to see whether a fix actually shrinks the
      # non-determinism rather than just moving it. `compare-screenshots.ts`
      # in its threshold-free "measure" mode (see its own docstring) does the
      # same pixelmatch comparison the CI drift gate uses, between this job's
      # own two runs rather than against the committed baseline. Only runs
      # when the file-level check above found a difference, and never fails
      # the job -- this is a measurement, not a gate.
      - name: Measure the two runs' pixel-level disagreement
        if: steps.determinism.outputs.identical == 'false'
        working-directory: frontend
        run: |
          node e2e/docs/compare-screenshots.ts \
            /tmp/screenshots-run1 \
            "$GITHUB_WORKSPACE/docs/assets/screenshots" \
            --json /tmp/determinism-pixels.json | tee -a "$GITHUB_STEP_SUMMARY"
          total=$(jq '[.[].diffPixels // 0] | add' /tmp/determinism-pixels.json)
          echo "Total drifted pixels across every image this pass: ${total}" | tee -a "$GITHUB_STEP_SUMMARY"

      # Runs before anything is proposed, for the reason set out at the top of
      # this file: a PR opened with GITHUB_TOKEN triggers no further workflow
      # runs, so nothing else will ever check this PR's own images unless this
      # job does it first.
      - name: Validate the site still builds
        run: ./scripts/build_site.sh

      - name: Validate the docs are still self-consistent
        run: uv run pytest backend/tests/test_docs_stay_current.py

      # "Changed" means what CI's drift check would have flagged — the same
      # `drift-policy.json`, so the two cannot disagree — and nothing else.
      # The first automatic run of this job (#1037) staged 19 images by
      # `git diff`, a byte comparison: eight were the policy's own excluded
      # set (QR codes carrying a database id, a real clock, a camera
      # viewfinder — different on every run by nature), and most of the rest
      # were byte-different PNGs pixelmatch calls identical, the ordinary
      # antialiasing residual. Staged by bytes, every merge to `main` would
      # produce a fifteen-image PR of exactly the noise the check is told to
      # ignore. So the working tree is put back to what is committed and only
      # the images the policy names are copied over it from the second run's
      # output: a new image is added, a removed one is deleted, a changed one
      # replaced. The second run's full output still goes up as the artifact.
      - name: Keep only the images the drift policy flags
        id: changes
        run: |
          set +e
          (
            cd frontend && node e2e/docs/compare-screenshots.ts \
              /tmp/screenshots-baseline \
              "$GITHUB_WORKSPACE/docs/assets/screenshots" \
              --policy e2e/docs/drift-policy.json \
              --json /tmp/regen-drift.json
          ) | tee /tmp/regen-drift.txt
          set -e
          rm -rf /tmp/screenshots-run2
          cp -r docs/assets/screenshots /tmp/screenshots-run2
          git checkout -- docs/assets/screenshots
          git clean -fdq -- docs/assets/screenshots
          awk '$1 == "FAIL" { print $3 }' /tmp/regen-drift.txt | while read -r rel; do
            if [ -f "/tmp/screenshots-run2/$rel" ]; then
              mkdir -p "$(dirname "docs/assets/screenshots/$rel")"
              cp "/tmp/screenshots-run2/$rel" "docs/assets/screenshots/$rel"
            else
              git rm -q -- "docs/assets/screenshots/$rel"
            fi
          done
          git add -A -- docs/assets/screenshots
          if git diff --cached --quiet -- docs/assets/screenshots; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          git diff --cached --name-status -- docs/assets/screenshots > /tmp/changed-files.txt || true
          git reset -- docs/assets/screenshots > /dev/null
          {
            echo "### Drift against \`${{ github.ref_name }}\`"
            echo
            echo '```'
            cat /tmp/regen-drift.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload regenerated screenshots as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: doc-screenshots
          path: /tmp/screenshots-run2/
          retention-days: 14

      # Nothing changed: say so where a person dispatching this by hand will
      # actually see it, and stop. No branch, no PR — an empty "regenerated"
      # PR every run is how a tool like this stops getting used.
      - name: Report no changes
        if: steps.changes.outputs.changed == 'false'
        run: |
          {
            echo "## Doc screenshots: no changes"
            echo
            echo "Regenerating every image under \`docs/assets/screenshots/\` produced no diff against \`${{ github.ref_name }}\`. Nothing to open a PR for."
            echo
            if [ "${{ steps.determinism.outputs.identical }}" = "true" ]; then
              echo "The two runs in this job were byte-identical."
            else
              echo "Note: the two runs in this job did not fully agree with each other (see the \"Compare the two runs\" step log), even though neither differs from \`${{ github.ref_name }}\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # A regeneration still open from an earlier run is stale the moment this
      # one has a newer `main`'s images in hand: its baseline would land on
      # top of these, or race them. Close it and drop its branch first — the
      # newest run always wins. Only branches this workflow itself names, so a
      # person's own `docs-screenshots/...` branch is never touched.
      - name: Close any regeneration this one supersedes
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("docs-screenshots/regen-")) | .number' \
          | while read -r number; do
              gh pr close "$number" --delete-branch \
                --comment "Superseded by a newer regeneration (run ${{ github.run_id }})."
            done

      - name: Open a pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="docs-screenshots/regen-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -- docs/assets/screenshots
          COUNT=$(git diff --cached --name-only -- docs/assets/screenshots | wc -l | tr -d ' ')

          {
            echo "Regenerate doc screenshots"
            echo
            echo "Produced by the Regenerate Doc Screenshots workflow (run ${{ github.run_id }}), against ${{ github.sha }}."
            echo
            echo "$COUNT image(s) changed. See the PR body for the full list and the"
            echo "two-run determinism check."
          } > /tmp/commit-message.txt

          git commit -F /tmp/commit-message.txt

          git push origin "$BRANCH"

          {
            echo "## $COUNT screenshot(s) changed"
            echo
            echo "Regenerated by running \`frontend/e2e/docs/*.spec.ts\` unsharded against ubuntu-latest — the same environment CI's \"Doc Screenshots\" job uses, but keeping the images it discards."
            echo
            echo "### Determinism check"
            echo
            if [ "${{ steps.determinism.outputs.identical }}" = "true" ]; then
              echo "Ran the suite twice; both runs produced byte-identical images. What follows is the diff between the second run and \`${{ github.ref_name }}\`."
            else
              echo "Ran the suite twice; **the two runs did not fully agree with each other**. This is a known class of noise (real clock times, camera viewfinder placement — see \`.claude/rules/documentation.md\`), but check the files below before merging:"
              echo
              echo '```'
              cat /tmp/determinism-diff.txt
              echo '```'
            fi
            echo
            echo "### Validation"
            echo
            echo "Before opening this PR, the job itself ran:"
            echo "- \`./scripts/build_site.sh\` (the same build Cloudflare Pages and CI's \"Docs Build\" job run)"
            echo "- \`uv run pytest backend/tests/test_docs_stay_current.py\`"
            echo
            echo "Both passed. This matters because a PR opened with the default \`GITHUB_TOKEN\` triggers no further workflow runs, so nothing else was going to check this PR's own images."
            echo
            echo "### Changed files"
            echo
            echo "Only images \`frontend/e2e/docs/drift-policy.json\` flags against \`${{ github.ref_name }}\` — the same threshold and exclusions CI's advisory check reads. Anything pixelmatch calls identical, and every excluded image, was left as committed."
            echo
            echo '```'
            cat /tmp/changed-files.txt
            echo '```'
            echo
            echo "---"
            echo
            echo "Opened automatically after a merge to \`main\`. Its CI run has been approved and auto-merge is on; if a picture here is wrong, close this PR and fix the spec — the next merge regenerates again."
            echo
            echo "🤖 Generated with [Claude Code](https://claude.com/claude-code)"
          } > /tmp/pr-body.md

          gh pr create \
            --title "Regenerate doc screenshots ($COUNT image(s))" \
            --body-file /tmp/pr-body.md \
            --base "${{ github.ref_name }}" \
            --head "$BRANCH"

          # The PR above does raise a `pull_request` event, but a bot-opened
          # PR's run is created *awaiting approval* rather than started, and
          # the ruleset counts that pending run's checks as owed: with every
          # required context already green from a separately dispatched run,
          # #1039 still sat at BLOCKED until a person approved the waiting run
          # — and merged the moment that run went green. So approve it here
          # instead of dispatching a duplicate. The run is created
          # asynchronously after the PR, hence the poll; a run that never
          # appears, or an approval this token is not allowed to give, fails
          # the step loudly with what to do by hand.
          head=$(git rev-parse HEAD)
          run_id=""
          for attempt in $(seq 1 24); do
            run_id=$(gh run list --workflow ci.yml --event pull_request --branch "$BRANCH" \
              --json databaseId,headSha,status \
              --jq ".[] | select(.headSha == \"$head\" and .status == \"action_required\") | .databaseId" | head -1)
            [ -n "$run_id" ] && break
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo "No pull_request run awaiting approval appeared for $BRANCH within two minutes." >&2
            echo "Approve it by hand: Actions → CI → the run for $BRANCH → Approve and run." >&2
            exit 1
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/approve" > /dev/null

          # And let it land on its own once those checks pass. After the
          # approval, not before: auto-merge on a PR with no checks yet simply
          # waits, but an approval that failed would leave it armed with
          # nothing ever coming to satisfy it — the step fails first.
          gh pr merge "$BRANCH" --auto --squash

          {
            echo "## $COUNT screenshot(s) changed — PR opened"
            echo
            echo "The PR's own CI run has been approved and auto-merge is enabled; it lands on its own once the required checks pass."
            echo
            cat /tmp/pr-body.md
          } >> "$GITHUB_STEP_SUMMARY"
