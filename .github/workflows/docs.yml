name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
  workflow_dispatch:          # allow manual trigger

permissions:
  contents: write             # needed to push to gh-pages branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0      # full history for git-dates plugin (optional)

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --only-group docs

      # `--strict` turns a broken link or a missing image into a failed build.
      # Without it, nine screenshots on the Race Setup page shipped broken for
      # as long as the page has existed: mkdocs warned on every deploy and
      # published anyway, and nobody reads a green job's log.
      #
      # Invoked via the venv's own binary rather than `uv run`, which would
      # silently re-sync the default `dev` group (and any plugin missing from
      # `docs` alone) back in before building — see #468.
      - name: Build and deploy
        run: .venv/bin/mkdocs gh-deploy --force --strict
