name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Granted per job below rather than here: the test job needs neither, and the
# release page and the registry are written by different steps.
permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------
  # Gate. CI runs on pull requests and on main, but a tag is neither: without
  # this, tagging any commit publishes it to GHCR and to the release page
  # whatever state it is in. Everything below waits on it.
  # -------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: uv sync

      - name: Backend tests
        run: uv run pytest backend/tests/

      - name: Types
        run: uv run mypy backend

      - name: Install Node dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend tests
        run: npm test -- --run
        working-directory: frontend

  # -------------------------------------------------------------------
  # Docker — build multi-platform image and push to GHCR
  # -------------------------------------------------------------------
  docker:
    name: Docker Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Read by the demo deploy below: it pushes the image this job published,
    # and only for a plain X.Y.Z — a release candidate must not become the
    # thing the front page sends people to.
    outputs:
      version: ${{ steps.version.outputs.version }}
      stable: ${{ steps.version.outputs.stable }}
    steps:
      - uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"           # e.g. v1.2.3
          VERSION="${TAG#v}"                  # 1.2.3
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # `latest` and the floating minor tag are what every install guide
          # tells people to pull, so only a plain X.Y.Z may claim them. The tag
          # glob that triggers this workflow also matches v1.2.3-rc1 — `*`
          # happily matches `3-rc1` — and a release candidate taking over
          # `latest` would hand it to everyone who followed the docs.
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "minor=${VERSION%.*}" >> "$GITHUB_OUTPUT"
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "Pre-release $VERSION: publishing the exact version only."
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set version in version.py
        run: echo "__version__ = \"${{ steps.version.outputs.version }}\"" > backend/version.py

      - name: Set up QEMU (for arm64 cross-build)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built for this runner first and actually started, before anything is
      # published. The image that shipped as v1.0.0 could not start at all —
      # it had no /data directory and runs as a non-root user — and nothing
      # noticed, because building an image proves only that it builds. The
      # multi-arch build below reuses this layer cache, so it costs little.
      - name: Build for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: trustytrack:release-candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name tt-release -p 8000:8000 trustytrack:release-candidate
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo "healthy"
              docker rm -f tt-release
              exit 0
            fi
            sleep 2
          done
          echo "the image never became healthy; not publishing it"
          docker logs tt-release
          docker rm -f tt-release
          exit 1

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/trusty-track:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.stable == 'true' && format('ghcr.io/{0}/trusty-track:{1}', github.repository_owner, steps.version.outputs.minor) || '' }}
            ${{ steps.version.outputs.stable == 'true' && format('ghcr.io/{0}/trusty-track:latest', github.repository_owner) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Written into a directory of its own, under the name a user actually
      # wants on disk. It cannot be generated at the repository root: a
      # `docker-compose.yml` is already checked in there — the one that builds
      # from source (`build: .`) rather than pulling the published image — and
      # overwriting it would mean the release shipped whichever of the two ran
      # last. The old name (`docker-compose-release.yml`) avoided that clash
      # and became the asset's filename, which is the bug this fixes.
      - name: Generate versioned docker-compose.yml
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          OWNER="${{ github.repository_owner }}"
          mkdir -p release-compose
          cat > release-compose/docker-compose.yml <<EOF
          services:
            app:
              image: ghcr.io/$OWNER/trusty-track:$VERSION
              ports:
                - "8000:8000"
              volumes:
                - trustytrack_data:/data
              environment:
                - TRUSTYTRACK_DATA_DIR=/data
              restart: unless-stopped
              healthcheck:
                test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
                interval: 10s
                timeout: 5s
                retries: 5
                start_period: 15s

          volumes:
            trustytrack_data:
          EOF

      - name: Upload docker-compose artifact
        uses: actions/upload-artifact@v7
        with:
          name: docker-compose
          path: release-compose/docker-compose.yml

  # -------------------------------------------------------------------
  # macOS .dmg
  # -------------------------------------------------------------------
  macos-dmg:
    name: macOS DMG
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: uv sync

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set version in version.py
        run: echo "__version__ = \"${{ steps.version.outputs.version }}\"" > backend/version.py

      - name: Build macOS app
        run: uv run bash packaging/build-mac.sh
        env:
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_NOTARIZATION_PASSWORD: ${{ secrets.APPLE_NOTARIZATION_PASSWORD }}

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: dist/TrustyTrack-*-mac.dmg

  # -------------------------------------------------------------------
  # Windows .exe installer
  # -------------------------------------------------------------------
  windows-exe:
    name: Windows Installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: uv sync

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Extract version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # `shell: bash` is load-bearing. A Windows runner's default shell is
      # PowerShell, where `\"` is not an escape — the string ends at the first
      # unescaped quote, and what reached backend/version.py was three lines of
      # `__version__ = \` / `1.2.3\` / an empty one. Python then raised a
      # SyntaxError the build script's `2>$null` swallowed, so the job failed
      # with one line of traceback and no cause.
      - name: Set version in version.py
        shell: bash
        run: echo "__version__ = \"${{ steps.version.outputs.version }}\"" > backend/version.py

      - name: Build Windows installer
        run: uv run powershell -ExecutionPolicy Bypass -File packaging\build-windows.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-exe
          path: dist/TrustyTrack-*-setup.exe

  # -------------------------------------------------------------------
  # Public demo — push the image just published to Cloud Run.
  #
  # Deliberately not a dependency of `create-release`. A release is a set of
  # artefacts people download; the demo is one hosted instance, and a Cloud Run
  # outage or an expired credential must not hold up the release page or the
  # installers. If it fails, the release still stands and this job is re-run by
  # hand from the Actions tab.
  #
  # Pre-releases are skipped for the same reason they do not claim `latest`:
  # the demo is where the docs and the front page send an evaluator, so it
  # follows stable versions only.
  # -------------------------------------------------------------------
  deploy-demo:
    name: Public Demo
    needs: docker
    if: needs.docker.outputs.stable == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-demo.yml
    with:
      image: ghcr.io/${{ github.repository_owner }}/trusty-track:${{ needs.docker.outputs.version }}

  # -------------------------------------------------------------------
  # Create GitHub Release
  # -------------------------------------------------------------------
  create-release:
    name: Create GitHub Release
    needs: [docker, macos-dmg, windows-exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Read by Release Drafter below, which builds the notes out of the pull
      # requests merged since the last published release.
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      # The landing page and install guides link straight to
      # releases/latest/download/<asset> (#474) so the URL never has to
      # change between releases. That only works if every release publishes
      # an asset under the *same* name, so each build's versioned file
      # (TrustyTrack-1.2.3-mac.dmg — kept for anyone browsing Assets on a
      # specific release, or comparing an older version) gets a copy under a
      # fixed name alongside it. The glob for one can't match the other:
      # "TrustyTrack-*-mac.dmg" requires a "-" both before and after the
      # version, which "TrustyTrack-mac.dmg" doesn't have.
      - name: Create stable-named copies for direct downloads
        run: |
          cp release-artifacts/macos-dmg/TrustyTrack-*-mac.dmg \
             release-artifacts/macos-dmg/TrustyTrack-mac.dmg
          cp release-artifacts/windows-exe/TrustyTrack-*-setup.exe \
             release-artifacts/windows-exe/TrustyTrack-setup.exe

      # The notes come from the draft Release Drafter has been maintaining on
      # every merge to main (`.github/workflows/release-drafter.yml`), which is
      # what makes them correctable before the tag rather than after it. Run
      # again here with the concrete tag, it rewrites that draft's name and
      # version and picks up anything merged since the last push — so what is
      # published is the draft the maintainer has already been reading.
      #
      # `publish: false` deliberately: the draft is filled in first, the
      # installers are attached to it while it is still a draft, and only then
      # is it made public. A release page that appears with no assets on it is
      # the thing every install guide's download link points at.
      - name: Draft the release notes
        uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
          tag: ${{ github.ref_name }}
          version: ${{ steps.version.outputs.version }}
          name: Trusty Track v${{ steps.version.outputs.version }}
          publish: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach the installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --clobber \
            release-artifacts/macos-dmg/TrustyTrack-*-mac.dmg \
            release-artifacts/macos-dmg/TrustyTrack-mac.dmg \
            release-artifacts/windows-exe/TrustyTrack-*-setup.exe \
            release-artifacts/windows-exe/TrustyTrack-setup.exe \
            release-artifacts/docker-compose/docker-compose.yml

      # A pre-release must not become `latest` here for the same reason it does
      # not claim the `latest` Docker tag: releases/latest/download/<asset> is
      # what the landing page and the install guides link to (#474).
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ needs.docker.outputs.stable }}" = "true" ]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false --latest
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --latest=false
          fi

  # -------------------------------------------------------------------
  # Raspberry Pi image (dknowles2/trusty-track#724, stage 2) — the build,
  # the pi-gen/QEMU details, and the boot smoke test all live in
  # raspberry-pi-image.yml, called here rather than duplicated so a manual
  # `workflow_dispatch` run of that file exercises the identical steps a
  # release does. See that file for what it builds, what it proves, and what
  # it deliberately does not.
  #
  # Built on every release, not on demand and not nightly: an image that
  # only sometimes matches the release it is attached to is worse than one
  # rebuilt fresh every time. `needs: [docker, create-release]` — the
  # release it attaches the image to has to exist first, and the version
  # comes off the same `docker` job output every other artefact's version
  # already does, rather than a second copy of the tag-stripping logic — and
  # nothing needs *this* job, so a slow or failed image build can never hold
  # up the installers or the release page. That is the same `deploy-demo`
  # shape above, generalised: the release itself does not wait on a job
  # whose cost or reliability it does not control. If it fails, the release
  # still stands with everything else attached, and this job is re-run by
  # hand from the Actions tab once the image exists again — `gh release
  # upload` inside the called workflow is exactly as re-runnable as the
  # installers' uploads are.
  #
  # The whole build is tens of minutes under QEMU/binfmt emulation (see
  # deploy/raspberry-pi/build.sh's own header); budget for that rather than
  # treating a long run here as stuck.
  # -------------------------------------------------------------------
  raspberry-pi:
    name: Raspberry Pi Image
    needs: [docker, create-release]
    permissions:
      contents: write
    uses: ./.github/workflows/raspberry-pi-image.yml
    with:
      version: ${{ needs.docker.outputs.version }}
      tag: ${{ github.ref_name }}
