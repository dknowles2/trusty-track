name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Granted per job below rather than here: the test job needs neither, and the
# release page and the registry are written by different steps.
permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------
  # Gate. CI runs on pull requests and on main, but a tag is neither: without
  # this, tagging any commit publishes it to GHCR and to the release page
  # whatever state it is in. Everything below waits on it.
  # -------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: uv sync

      - name: Backend tests
        run: uv run pytest backend/tests/

      - name: Types
        run: uv run mypy backend

      - name: Install Node dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend tests
        run: npm test -- --run
        working-directory: frontend

  # -------------------------------------------------------------------
  # Docker — build multi-platform image and push to GHCR
  # -------------------------------------------------------------------
  docker:
    name: Docker Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"           # e.g. v1.2.3
          VERSION="${TAG#v}"                  # 1.2.3
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # `latest` and the floating minor tag are what every install guide
          # tells people to pull, so only a plain X.Y.Z may claim them. The tag
          # glob that triggers this workflow also matches v1.2.3-rc1 — `*`
          # happily matches `3-rc1` — and a release candidate taking over
          # `latest` would hand it to everyone who followed the docs.
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "minor=${VERSION%.*}" >> "$GITHUB_OUTPUT"
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "Pre-release $VERSION: publishing the exact version only."
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set version in version.py
        run: echo "__version__ = \"${{ steps.version.outputs.version }}\"" > backend/version.py

      - name: Set up QEMU (for arm64 cross-build)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built for this runner first and actually started, before anything is
      # published. The image that shipped as v1.0.0 could not start at all —
      # it had no /data directory and runs as a non-root user — and nothing
      # noticed, because building an image proves only that it builds. The
      # multi-arch build below reuses this layer cache, so it costs little.
      - name: Build for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: trustytrack:release-candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name tt-release -p 8000:8000 trustytrack:release-candidate
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo "healthy"
              docker rm -f tt-release
              exit 0
            fi
            sleep 2
          done
          echo "the image never became healthy; not publishing it"
          docker logs tt-release
          docker rm -f tt-release
          exit 1

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/trusty-track:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.stable == 'true' && format('ghcr.io/{0}/trusty-track:{1}', github.repository_owner, steps.version.outputs.minor) || '' }}
            ${{ steps.version.outputs.stable == 'true' && format('ghcr.io/{0}/trusty-track:latest', github.repository_owner) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate versioned docker-compose.yml
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          OWNER="${{ github.repository_owner }}"
          cat > docker-compose-release.yml <<EOF
          services:
            app:
              image: ghcr.io/$OWNER/trusty-track:$VERSION
              ports:
                - "8000:8000"
              volumes:
                - trustytrack_data:/data
              environment:
                - TRUSTYTRACK_DATA_DIR=/data
              restart: unless-stopped
              healthcheck:
                test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
                interval: 10s
                timeout: 5s
                retries: 5
                start_period: 15s

          volumes:
            trustytrack_data:
          EOF

      - name: Upload docker-compose artifact
        uses: actions/upload-artifact@v7
        with:
          name: docker-compose
          path: docker-compose-release.yml

  # -------------------------------------------------------------------
  # macOS .dmg
  # -------------------------------------------------------------------
  macos-dmg:
    name: macOS DMG
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: uv sync

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set version in version.py
        run: echo "__version__ = \"${{ steps.version.outputs.version }}\"" > backend/version.py

      - name: Build macOS app
        run: uv run bash packaging/build-mac.sh
        env:
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_NOTARIZATION_PASSWORD: ${{ secrets.APPLE_NOTARIZATION_PASSWORD }}

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: dist/TrustyTrack-*-mac.dmg

  # -------------------------------------------------------------------
  # Windows .exe installer
  # -------------------------------------------------------------------
  windows-exe:
    name: Windows Installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: uv sync

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Extract version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set version in version.py
        run: echo "__version__ = \"${{ steps.version.outputs.version }}\"" > backend/version.py

      - name: Build Windows installer
        run: uv run powershell -ExecutionPolicy Bypass -File packaging\build-windows.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-exe
          path: dist/TrustyTrack-*-setup.exe

  # -------------------------------------------------------------------
  # Create GitHub Release
  # -------------------------------------------------------------------
  create-release:
    name: Create GitHub Release
    needs: [docker, macos-dmg, windows-exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "$GITHUB_REF_NAME" \
            --title "Trusty Track v$VERSION" \
            --generate-notes \
            release-artifacts/macos-dmg/TrustyTrack-*-mac.dmg \
            release-artifacts/windows-exe/TrustyTrack-*-setup.exe \
            release-artifacts/docker-compose/docker-compose-release.yml#docker-compose.yml
