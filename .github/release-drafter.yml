# Release notes, drafted from merged pull requests.
#
# The changelog this project actually wants is its pull request titles: every
# commit on main is a squashed PR, and those titles are already written as
# sentences a person can read. Release Drafter collects them; the categories
# below are the existing repository labels, so a note lands in a section
# because somebody labelled the PR, not because of anything it says.
#
# `release-drafter.yml` keeps a rolling draft up to date on every push to main,
# so the pull requests the next release will carry are always visible. That
# list is the starting point for the notes, not the notes: the body is
# re-rendered from this template on every run, so write the real notes into
# the draft on GitHub once the last change has merged, and then tag.
# `release.yml` adopts the draft as it stands — it does not run the drafter
# again, precisely so those notes survive — sets its tag and title, attaches
# the installers, and publishes it. The drafter only runs at tag time when
# there is no draft to adopt.

name-template: "Trusty Track v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

# Uncategorized pull requests are rendered first, with no heading of their own.
# That is deliberate rather than a gap: an unlabelled PR here is a change to
# the app itself, which is the part somebody opening the release page came to
# read, and the labelled sections below are the supporting detail.
template: |
  ## What's new

  $CHANGES

  **Full changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

categories:
  - title: "Bug fixes"
    labels:
      - bug
  - title: "Security"
    labels:
      - security
  - title: "Performance"
    labels:
      - performance
  - title: "Documentation"
    labels:
      - documentation
  - title: "Under the hood"
    labels:
      - architecture
      - tech-debt
  - title: "Dependencies"
    labels:
      - dependencies
      - github_actions
      - python:uv
      - javascript

# A PR carrying any of these is not a change anybody shipped.
exclude-labels:
  - duplicate
  - invalid
  - wontfix
  - icebox

change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
# A title containing backticks or angle brackets would otherwise render as
# markup in the release body. `#` is deliberately absent: titles here name the
# issue they close ("Document the terminology setting (#496, stage 5)"), and
# escaping it turns a link the reader can follow into literal text with an
# HTML comment wedged through the middle of it.
change-title-escapes: '\<*_&`@'

no-changes-template: "- No changes"

# Only the label decides the bump. There is no `breaking` label in this
# repository, so a major version is a deliberate act by whoever cuts the tag —
# which is what `tag-template` is for; this only suggests the draft's name.
version-resolver:
  minor:
    labels:
      - enhancement
      - architecture
  patch:
    labels:
      - bug
      - documentation
      - dependencies
      - performance
      - security
      - tech-debt
  default: patch

# Titles here are prose, not conventional commits, so most PRs match nothing
# and stay uncategorized — which is the headline list above. These three
# prefixes are the ones this project does use.
autolabeler:
  - label: documentation
    title:
      - '/^docs(\([^)]*\))?:/i'
      - '/^fix\(docs\):/i'
    branch:
      - '/^docs\//'
  - label: bug
    # `fix(docs):` is a documentation change, and is excluded here so it lands
    # in one section rather than two.
    title:
      - '/^fix(?!\(docs\))(\([^)]*\))?:/i'
    branch:
      - '/^fix\//'
  - label: dependencies
    branch:
      - '/^dependabot\//'
