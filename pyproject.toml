[project]
name = "trusty-track2"
version = "0.1.0"
description = "A race tracking and timing system"
authors = [
    { name = "David Knowles", email = "dknowles2@gmail.com" }
]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "sqlalchemy",
    "strawberry-graphql",
    "numpy",
    "Pillow",
    "pillow-heif",
    "pyserial",
    "cryptography",
    "python-dotenv",
    "alembic>=1.16.5",
    "qrcode[pil]>=8.2",
]
readme = "README.md"
requires-python = ">=3.10"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    # The suite is 5,900 tests with no single slow one, so the only lever on
    # its runtime is running them at once: about 85 seconds becomes about 27
    # on a four-core machine. See `addopts` below.
    "pytest-xdist",
    "httpx",
    "ruff",
    "mypy",
    "pyinstaller",
    "pre-commit",
    # `test_docs_stay_current.py` renders each page and reads the heading ids
    # the real toc extension produces, rather than reimplementing its slug
    # rules. Already present as a transitive dependency of mkdocs; named here
    # because a test depends on it directly.
    "markdown",
    { include-group = "docs" },
]
# Everything `mkdocs build` needs, and nothing else — CI's "Docs Build" job and
# the deploy both install this group alone, so a plugin named in `mkdocs.yml`
# and missing from here is a broken build. `mkdocs-callouts` was in `dev` and
# only in `dev`, which worked for anybody who had run a full `uv sync` and for
# nobody else.
#
# Keep `docs/requirements.txt` in step: Cloudflare Pages builds
# trusty-track.com with pip and reads that file rather than this one.
docs = [
    "mkdocs-material",
    "mkdocs-callouts>=1.16.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
# One worker per core, everywhere — CI, the pre-commit hook and a run by hand.
# Nothing in the suite shares state between tests: the database is in-memory
# per test, and the one thing that was shared, the data directory, is now per
# worker (see `conftest.py`). Pass `-n0` to turn it off, which is what you
# want when a failure needs `pdb` or the output read in order.
addopts = "-n auto"

[tool.mypy]
# No `python_version`. Pinning it to the 3.10 floor makes mypy parse every
# third-party stub under 3.10 rules, and numpy's use `type` statements, which
# are 3.12 syntax — the check dies before reaching our code. The floor is
# covered where it belongs anyway: ruff's `target-version` for syntax, and a
# real 3.10 job in CI that runs the tests.
#
# SQLAlchemy, Strawberry and Pillow are typed; pyserial and pillow-heif are not.
ignore_missing_imports = true
exclude = [
    # Tests build malformed rows on purpose — a blob with a string time, a lane
    # with no racer — which is the point of them.
    "backend/tests/",
    # A migration has to keep producing the same result years from now. Editing
    # one to satisfy a checker is changing history, not fixing a bug.
    "backend/migrations/versions/",
]

# The domain layer is where types carry their weight: plain functions over plain
# values, no ORM rows, no framework. It is also where a wrong one is expensive —
# `field_size` returning the wrong number is #52. Held to a stricter standard
# than the rest, and clean.
[[tool.mypy.overrides]]
module = "backend.domain.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true

# Not clean yet. An exemption list rather than a list of what to *check*, so the
# gate covers the tree by default: a new module is checked from the day it is
# written, and this list can only shrink. Removing an entry is a good PR.
#
# Down from nine to one. `crud` and `services.timer.manager` came off once
# somebody counted: the note here said all three were "dominated by Strawberry's
# duck-typing", and between them they had seven errors, none of which were. Two
# were real — a heat dereferenced without checking it still existed, and a
# command logged as `b'RV\r'` instead of through the formatter beside it.
#
# `api.schema` is the genuine case. Its resolvers return ORM rows and `self` is
# not the type it is declared on, so most of what is left wants `type: ignore`
# at each site with a reason rather than a fix — worth doing on purpose rather
# than in passing. Removing this last entry is still a good PR.
[[tool.mypy.overrides]]
module = [
    "backend.api.schema",
]
ignore_errors = true

[tool.ruff]
line-length = 88
target-version = "py310"
# Design notes, not source. `ruff format` reformats Python blocks inside
# Markdown, which would rewrite records of decisions already taken.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "ARG"]
ignore = []

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends", "fastapi.Query", "fastapi.params.Query", "fastapi.File", "fastapi.params.File", "fastapi.Form", "fastapi.params.Form", "fastapi.Body", "fastapi.params.Body"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["backend"]
